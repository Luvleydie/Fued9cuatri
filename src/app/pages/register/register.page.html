<ion-content>
  <main class="auth-shell">
    <section class="panel auth-panel fade-in" aria-labelledby="register-title">
      <a class="brand" routerLink="/login">Usuarios</a>
      <h1 id="register-title">Crear cuenta</h1>
      <p class="muted">Completa tus datos para comenzar.</p>
      <form #form="ngForm" (ngSubmit)="register()" [attr.aria-busy]="isSubmitting">
        <label class="field" for="register-username">
          Usuario
          <input id="register-username" name="username" [(ngModel)]="user.username" required minlength="3"
            maxlength="100" autocomplete="username" placeholder="Tu usuario" [disabled]="isSubmitting">
        </label>
        <div class="field-grid">
          <label class="field" for="register-firstname">
            Nombre
            <input id="register-firstname" name="firstName" [(ngModel)]="user.firstName" required
              maxlength="100" autocomplete="given-name" [disabled]="isSubmitting">
          </label>
          <label class="field" for="register-lastname">
            Apellido
            <input id="register-lastname" name="lastName" [(ngModel)]="user.lastName" required
              maxlength="100" autocomplete="family-name" [disabled]="isSubmitting">
          </label>
        </div>
        <label class="field" for="register-email">
          Correo electrónico
          <input id="register-email" name="email" type="email" email [(ngModel)]="user.email" required
            maxlength="254" autocomplete="email" placeholder="nombre@ejemplo.com" [disabled]="isSubmitting">
        </label>
        <label class="field" for="register-password">
          Contraseña
          <input id="register-password" name="password" type="password" [(ngModel)]="user.password" required
            minlength="8" maxlength="200" autocomplete="new-password" placeholder="Mínimo 8 caracteres" [disabled]="isSubmitting">
        </label>
        @if (errorMessage) { <p class="form-error" role="alert">{{ errorMessage }}</p> }
        @if (successMessage) { <p class="form-success" role="status">{{ successMessage }}</p> }
        <div class="form-actions">
          <button class="primary-button" type="submit" [disabled]="form.invalid || isSubmitting || !!successMessage">
            @if (isSubmitting) { <ion-spinner name="crescent" aria-hidden="true"></ion-spinner> }
            {{ isSubmitting ? 'Guardando…' : 'Crear cuenta' }}
          </button>
        </div>
      </form>
      <p>¿Ya tienes cuenta? <a class="auth-link" routerLink="/login">Iniciar sesión</a></p>
    </section>
  </main>
</ion-content>
